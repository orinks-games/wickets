name: Nightly

# Builds the default branch once a night when it has new commits, on
# GitHub-hosted Linux and Windows runners. No macOS (release-only).
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Skips the night when the default branch has not moved since the last
  # successful nightly. A hand run always builds.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('build', 'true');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'nightly.yml',
              branch: context.ref.replace('refs/heads/', ''),
              status: 'success',
              per_page: 1,
            });
            const last = data.workflow_runs[0];
            const build = !last || last.head_sha !== context.sha;
            core.info(last ? `Last successful nightly built ${last.head_sha}; HEAD is ${context.sha}.` : 'No successful nightly yet.');
            core.setOutput('build', build ? 'true' : 'false');

  build:
    name: build (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Nightlies are stub-only: their artifacts are downloadable, so they
    # never carry the private overlay.
    env:
      WICKETS_MODE: stub
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          token: ${{ secrets.HEARKEN_TOKEN }}
          cache-key: nightly
      - uses: ./.github/actions/hearken-cli
      - name: Rebuild SDL2.dll if the cache left it out
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -z "$(find target/release -maxdepth 1 -name SDL2.dll -print -quit)" ]; then
            cargo clean --release -p hearken-app
          fi
      # Same packaging as a hand run of the release workflow, on the alpha
      # channel; the package stays a short-lived run artifact.
      - name: Package
        id: package
        shell: bash
        env:
          HEARKEN_SEAL_SECRET: ${{ secrets.HEARKEN_SEAL_SECRET }}
          HEARKEN_UPDATE_SECRET: ${{ secrets.HEARKEN_UPDATE_SECRET }}
        run: |
          rm -rf dist
          hearken release --channel=alpha
          file=
          for f in dist/wickets-*.zip dist/wickets-*.tar.gz; do
            [ -e "$f" ] && file=$f
          done
          if [ -z "$file" ]; then
            echo "::error::hearken release left no package in dist/."
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: nightly-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
          compression-level: 0
          retention-days: 3
      # Drop the token from the git config once the package is built.
      - name: Forget the Hearken token
        if: always() && runner.os == 'Linux'
        shell: bash
        run: git config --global --remove-section url."https://x-access-token:${{ secrets.HEARKEN_TOKEN }}@github.com/orinks-games/hearken" 2>/dev/null || true

  # The public tree must not name anything in the private overlay. Runs in
  # this trusted scheduled job only (never on pull requests), and prints
  # paths and line numbers only.
  spoiler-check:
    name: spoiler check
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check out the private overlay
        uses: actions/checkout@v5
        with:
          repository: orinks-games/wickets-secrets
          path: secrets
          ssh-key: ${{ secrets.WICKETS_SECRETS_DEPLOY_KEY }}
          persist-credentials: false
      - run: python3 tools/check_spoilers.py --require
      - run: python3 tools/check_drift.py --require
