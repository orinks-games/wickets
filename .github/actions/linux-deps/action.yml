name: Linux build dependencies
description: SDL2 desktop backends, Speech Dispatcher headers and gcc 13 for Prism.
runs:
  using: composite
  steps:
    # SDL2 is compiled in (`bundled` + `static-link`), and a video or audio
    # backend whose headers are missing here is compiled out for every
    # player. Prism needs gcc 13's libstdc++ (linked statically by build.rs; Ubuntu 24.04 ships it)
    # and builds its Speech Dispatcher backend only when libspeechd-dev is
    # present.
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake pkg-config gcc-13 g++-13 libspeechd-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
          libxinerama-dev libxss-dev libxfixes-dev libxkbcommon-dev \
          libwayland-dev wayland-protocols libdecor-0-dev \
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
          libasound2-dev libpulse-dev libpipewire-0.3-dev \
          libdbus-1-dev libudev-dev libibus-1.0-dev
        echo "CC=gcc-13" >> "$GITHUB_ENV"
        echo "CXX=g++-13" >> "$GITHUB_ENV"
        # Prism's objects carry gcc 13 link-time bytecode the system cc cannot read.
        echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-13" >> "$GITHUB_ENV"
