name: Rust build setup
description: Hearken access, the platform's build dependencies, the pinned toolchain and the compile cache.
inputs:
  token:
    description: The HEARKEN_TOKEN secret, if set. Optional, since Hearken is public.
    required: false
    default: ''
  cache-key:
    description: >-
      Names the compile cache. Jobs that build the same way (same profile,
      same platform) share one key, so one job's cache warms the others.
    required: true
  save:
    description: >-
      Whether this job may save the cache. Even then it saves only on main,
      so pull requests restore main's cache instead of filling the cache
      quota with one copy per branch. Set it to false for any build that
      includes the private overlay: a cache saved on main can be restored by
      any pull request, forks included. Restoring is always safe, since the
      cache keeps dependencies only, never this workspace's own crates.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/hearken-access
      with:
        token: ${{ inputs.token }}
    - uses: ./.github/actions/linux-deps
      if: runner.os == 'Linux'
    - uses: ./.github/actions/windows-deps
      if: runner.os == 'Windows'
    - shell: bash
      run: rustup show
    # Keeps the compiled dependencies (including the C builds, SDL and
    # Prism) in target/. The workspace's own crates are left out, and are
    # rebuilt every run. (sccache was tried and dropped: the workspace's
    # crates change on nearly every pull request, so it hit 2 to 3 percent.)
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}
        cache-on-failure: true
