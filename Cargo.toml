[workspace]
resolver = "2"
members = ["crates/*", "extras/*", "games/*"]

[workspace.package]
version = "1.8.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/orinks-games/echo-parlor"
authors = ["Joshua Tubbs (Orinks)"]
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure Rust maths, the same to the last bit on every computer and in
# WebAssembly, for rules a server replays.
libm = "0.2"
log = "0.4"
# The engine, from its main branch (Cargo.lock pins the commit). To build
# against a local checkout, add to .cargo/config.toml (or ~/.cargo/config.toml):
#   [patch."https://github.com/orinks-games/hearken"]
#   hearken = { path = "../hearken/crates/hearken" }
hearken = { git = "https://github.com/orinks-games/hearken", rev = "5035e36dc694525634266ebe07aa211d2ba6ff30", features = ["visuals", "online", "report"] }
hearken-l10n-tools = { git = "https://github.com/orinks-games/hearken", rev = "5035e36dc694525634266ebe07aa211d2ba6ff30" }
hearken-replay = { git = "https://github.com/orinks-games/hearken", rev = "5035e36dc694525634266ebe07aa211d2ba6ff30" }
parlor-core = { path = "crates/parlor-core" }
wickets-rules = { path = "crates/wickets-rules" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.test]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
