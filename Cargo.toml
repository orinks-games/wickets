[workspace]
resolver = "2"
members = ["crates/*", "extras/*", "games/*"]

[workspace.package]
version = "1.5.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/orinks-games/echo-parlor"
authors = ["Joshua Tubbs (Orinks)"]
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# The engine, from its main branch (Cargo.lock pins the commit). To build
# against a local checkout, add to .cargo/config.toml (or ~/.cargo/config.toml):
#   [patch."https://github.com/orinks-games/hearken"]
#   hearken = { path = "../hearken/crates/hearken" }
hearken = { git = "https://github.com/orinks-games/hearken", rev = "ff744522adf43c802f270f2c10c5f15ef5fbfe1a", features = ["visuals"] }
parlor-core = { path = "crates/parlor-core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.test]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
