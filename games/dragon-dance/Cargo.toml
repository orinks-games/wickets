[package]
name = "dragon-dance"
description = "Dragon Dance, a Wicket's game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
publish = false
build = "build.rs"
# The test files are modules of tests/all.rs, one binary (see that file).
autotests = false

[lib]
# Unit tests for the calendar logic live in src; no doc examples. The
# integration tests live in tests/all.rs.
doctest = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
hearken.workspace = true
parlor-core.workspace = true
serde.workspace = true
